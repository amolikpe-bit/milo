name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: npm run setup
      - run: npm run contract:compile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
